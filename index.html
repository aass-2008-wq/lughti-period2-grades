<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>درجات الفترة الثانية - مادة لغتي</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
:root{
  --dark:#06251d;
  --green:#0b5a45;
  --green2:#0f7a5a;
  --gold:#d8b65a;
  --text:#f4fff9;
  --muted:rgba(244,255,249,.75);
  --glass:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.18);
}
body{
  margin:0;
  min-height:100vh;
  font-family:"Tajawal",Arial,sans-serif;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:
    radial-gradient(circle at 15% 15%, rgba(25,160,115,.45), transparent 34%),
    radial-gradient(circle at 85% 25%, rgba(216,182,90,.18), transparent 32%),
    radial-gradient(circle at 45% 90%, rgba(12,110,80,.50), transparent 35%),
    linear-gradient(135deg,#031b15,#073628 45%,#02130f);
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:-40%;
  background:
    linear-gradient(115deg, transparent 35%, rgba(255,255,255,.05) 45%, transparent 55%),
    linear-gradient(65deg, transparent 38%, rgba(216,182,90,.06) 48%, transparent 58%);
  animation:wave 13s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes wave{
  from{transform:translateX(-3%) translateY(-2%) rotate(0deg)}
  to{transform:translateX(3%) translateY(2%) rotate(3deg)}
}
.wrap{
  width:min(980px,100%);
  position:relative;
  z-index:1;
}
.hero{
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.07));
  border-radius:28px;
  padding:18px;
  box-shadow:0 25px 70px rgba(0,0,0,.38);
  backdrop-filter:blur(14px);
}
.logos{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.logoBox{
  width:92px;
  height:92px;
  border-radius:22px;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
}
.logoBox img{
  max-width:86%;
  max-height:86%;
  object-fit:contain;
}
.title{
  text-align:center;
  flex:1;
}
.title h1{
  margin:0;
  font-size:clamp(23px,4vw,38px);
  font-weight:900;
  line-height:1.45;
}
.title p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:15px;
  font-weight:600;
}
.names{
  margin-top:14px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
.pill{
  padding:8px 13px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(0,0,0,.18);
  color:var(--muted);
  font-size:14px;
}
.pill b{color:var(--gold)}
.card{
  margin-top:16px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.08);
  border-radius:24px;
  padding:18px;
  backdrop-filter:blur(12px);
}
.form{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:12px;
  align-items:end;
}
label{
  display:block;
  margin-bottom:7px;
  color:var(--muted);
  font-size:14px;
}
select,input{
  width:100%;
  border:none;
  outline:none;
  color:var(--text);
  background:rgba(0,0,0,.24);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px 14px;
  font-size:17px;
  font-family:inherit;
}
option{color:#111}
button{
  border:none;
  cursor:pointer;
  border-radius:16px;
  padding:14px 19px;
  font-family:inherit;
  font-size:17px;
  font-weight:900;
  color:#082217;
  background:linear-gradient(180deg,#e9cf79,#c9a842);
  box-shadow:0 12px 25px rgba(216,182,90,.22);
  white-space:nowrap;
}
.notice{
  margin-top:12px;
  text-align:center;
  color:var(--muted);
  line-height:1.8;
  font-size:14px;
}
.result{
  display:none;
  margin-top:16px;
  border-radius:22px;
  border:1px solid var(--line);
  background:rgba(0,0,0,.18);
  padding:16px;
  animation:pop .35s ease;
}
.result.show{display:block}
@keyframes pop{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.badge{
  display:inline-block;
  padding:8px 14px;
  border-radius:999px;
  font-weight:900;
  border:1px solid var(--line);
  background:rgba(255,255,255,.08);
}
.ex{border-color:#40e18f;color:#7dffbd}
.vg{border-color:#d8b65a;color:#ffe08a}
.gd{border-color:#ffbd59;color:#ffd18b}
.ns{border-color:#ff6b6b;color:#ff9b9b}
.infoGrid{
  margin-top:12px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.info{
  border:1px solid var(--line);
  background:rgba(255,255,255,.07);
  border-radius:16px;
  padding:12px;
}
.info span{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:5px;
}
.info b{
  font-size:17px;
}
.msg{
  margin-top:12px;
  border:1px dashed rgba(216,182,90,.45);
  background:rgba(216,182,90,.08);
  border-radius:18px;
  padding:13px;
  line-height:1.9;
  white-space:pre-line;
}
.special{
  border:1px solid rgba(216,182,90,.7);
  background:linear-gradient(180deg,rgba(216,182,90,.18),rgba(255,255,255,.06));
  box-shadow:0 0 28px rgba(216,182,90,.12);
}
.footer{
  margin-top:14px;
  text-align:center;
  color:rgba(244,255,249,.58);
  font-size:13px;
}
@media(max-width:760px){
  body{padding:14px}
  .logos{gap:8px}
  .logoBox{width:70px;height:70px;border-radius:18px}
  .form{grid-template-columns:1fr}
  .infoGrid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="wrap">

  <div class="hero">

    <div class="logos">

      <div class="logoBox">
        <img src="https://i.postimg.cc/PJrNMyG5/O-U-O-U-U-O-U-U-4.png" alt="شعار المدرسة">
      </div>

      <div class="title">
        <h1>درجات الفترة الثانية<br>مادة لغتي للفصل الثاني</h1>
        <p>مدرسة الإمام الشوكاني الابتدائية</p>
      </div>

      <div class="logoBox">
        <img src="https://up6.cc/2026/05/177850928377751.png" alt="شعار وزارة التعليم">
      </div>

    </div>

    <div class="names">
      <div class="pill">اسم المعلم: <b>مقرن المطيري</b></div>
      <div class="pill">مدير المدرسة: <b>توفيق العقيلي</b></div>
    </div>

  </div>

  <div class="card">

    <div class="form">

      <div>
        <label>اختر الفصل</label>
        <select id="classSel">
          <option value="c1">سادس 1</option>
          <option value="c2">سادس 2</option>
        </select>
      </div>

      <div>
        <label>رقم الهوية الوطنية</label>
        <input id="nid" inputmode="numeric" maxlength="10" placeholder="اكتب رقم الهوية">
      </div>

      <button onclick="searchStudent()">عرض النتيجة</button>

    </div>

    <div class="notice">
      تم اعتماد البحث برقم الهوية الوطنية حفاظًا على خصوصية الطلاب.
    </div>

    <div id="result" class="result"></div>

    <div class="footer">
      © 2026 — برمجة وتنفيذ الأستاذ مقرن المطيري
    </div>

  </div>
</div>

<script>
const class1 = [
{id:"1168642740",name:"أسامة يوسف العقيلي",score:20},
{id:"1170460776",name:"جزاء بن ضيف الله المطيري",score:13},
{id:"1170277154",name:"جواد بن عبدالله العويد",score:20},
{id:"1194393508",name:"سلمان بن محمد السعيد",score:14},
{id:"1174705549",name:"سليمان بن إبراهيم الحايك",score:20},
{id:"1169763651",name:"صالح بن خالد الناصر",score:17},
{id:"1185084215",name:"صالح بن مبروك المطيري",score:19},
{id:"1169767207",name:"عبدالرحمن بن فهد الحربي",score:20},
{id:"2399977905",name:"عبدالرحمن حسن أحمد",score:18},
{id:"1171024993",name:"عبدالعزيز بن أحمد الزاحم",score:20},
{id:"1165790955",name:"عبدالله بن عبدالعزيز الحواس",score:20},
{id:"0160477791",name:"عزام صابر حمود خالد",score:20},
{id:"2374013668",name:"علي عمر علي عثمان",score:20},
{id:"1168582235",name:"غيث بن بندر الوهيد",score:20},
{id:"1168307427",name:"فواز بن عبدالله الفايز",score:20},
{id:"1168512232",name:"فيصل بن عبدالله الشايع",score:16},
{id:"1170346751",name:"قصي بن صالح الشهباني",score:20},
{id:"1168115929",name:"محمد بن زياد المطيري",score:20},
{id:"1171445479",name:"ناصر بن حسن القويفلي",score:17},
{id:"2368105413",name:"نذير مشعل نذير الشمري",score:16},
{id:"1182476521",name:"يوسف بن سليمان الفراج",score:13}
];

const class2 = [
{id:"1181528678",name:"راكان بن سليمان الزيد",score:17},
{id:"1168028882",name:"رواف بن عبدالعزيز المطيري",score:20},
{id:"1169805924",name:"زعيم بن فارس المطيري",score:20},
{id:"1169764204",name:"زياد بن محمد المجلاد",score:16},
{id:"1167082948",name:"سعود بن فهد الدهيسان",score:18},
{id:"1177151386",name:"عامر بن أحمد العامر",score:19},
{id:"1172319483",name:"عبدالرحمن بن مطلق الثبيتي",score:16},
{id:"1170188542",name:"عبدالرحمن سلطان الراجح",score:20},
{id:"1169243159",name:"عبدالله بن إبراهيم الصقيل",score:20},
{id:"1168543955",name:"عزام بن عبدالله اللذيذ",score:20},
{id:"1169932884",name:"علي بن فهد الكريشان",score:20},
{id:"1170877607",name:"فهد بن سعد العتيبي",score:19},
{id:"1168336541",name:"فهد بن محمد المطيري",score:16},
{id:"1171144247",name:"ماجد بن سعود العتيبي",score:17},
{id:"1171267618",name:"محمد بن عبدالرحمن القويفلي",score:19},
{id:"1171181249",name:"محمد بن عبدالعزيز المعثم",score:20},
{id:"1169321526",name:"محمد بن عبدالعزيز الغنايم",score:20},
{id:"1170350696",name:"محمد بن عبدالله المطلق",score:19},
{id:"1166311827",name:"محمد بن فهد المطيري",score:15},
{id:"1170437576",name:"مراد بن سليمان المطلق",score:18}
];

function level(score){
  if(score >= 17) return {label:"ممتاز", cls:"ex", msg:"أداء ممتاز ودرجة مميزة، نفخر باجتهادك ونتمنى لك مزيدًا من التفوق."};
  if(score >= 14) return {label:"جيد جدًا", cls:"vg", msg:"مستوى جيد جدًا، استمر في المراجعة والاجتهاد وستصل للأفضل بإذن الله."};
  if(score === 13) return {label:"جيد", cls:"gd", msg:"مستوى جيد، وبمزيد من التركيز والمراجعة سترتفع درجتك بإذن الله."};
  return {label:"يحتاج تحسين", cls:"ns", msg:"تحتاج إلى مزيد من المراجعة والتدريب، وبإذن الله تستطيع تحقيق نتيجة أفضل."};
}

function searchStudent(){

  const nid = document.getElementById("nid").value.replace(/\D/g,"");
  const className = document.getElementById("classSel").selectedOptions[0].textContent;
  const data = document.getElementById("classSel").value === "c1" ? class1 : class2;
  const box = document.getElementById("result");

  if(nid.length !== 10){
    box.className = "result show";
    box.innerHTML = `
      <span class="badge ns">تنبيه</span>
      <div class="msg">
      فضلاً اكتب رقم الهوية الوطنية المكون من 10 أرقام.
      </div>
    `;
    return;
  }

  const st = data.find(s => s.id === nid);

  if(!st){
    box.className = "result show";
    box.innerHTML = `
      <span class="badge ns">غير موجود</span>
      <div class="msg">
      لم يتم العثور على طالب بهذه الهوية في الفصل المحدد.
      </div>
    `;
    return;
  }

  const l = level(st.score);

  const isAzzam = st.id === "1168543955";

  const specialMsg = `الطالب المبدع عزام عبدالله اللذيذ
نفخر بتميزك الدراسي وإبداعك التقني، ونعتز بمشاركاتك في البرمجة والذكاء الاصطناعي، وجهودك المميزة في تطوير مشاريع الفصل والمدرسة.
استمر في الإبداع والابتكار، فالمستقبل ينتظر أمثالك 🌟`;

  box.className = "result show";

  box.innerHTML = `
    <span class="badge ${l.cls}">
      التقدير: ${l.label}
    </span>

    <div class="infoGrid">

      <div class="info">
        <span>اسم الطالب</span>
        <b>${st.name}</b>
      </div>

      <div class="info">
        <span>رقم الهوية</span>
        <b>${st.id}</b>
      </div>

      <div class="info">
        <span>الفصل</span>
        <b>${className}</b>
      </div>

      <div class="info">
        <span>الدرجة</span>
        <b>${st.score} / 20</b>
      </div>

    </div>

    <div class="msg ${isAzzam ? "special" : ""}">
${isAzzam ? specialMsg : l.msg}
    </div>
  `;
}

document.getElementById("nid").addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    searchStudent();
  }
});
</script>

</body>
</html>
